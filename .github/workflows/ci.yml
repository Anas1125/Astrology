
name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
        working-directory: backend
      - run: ruff check .
        working-directory: backend
      - run: pytest
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/astroai-ci-migrations.sqlite3
      - run: alembic upgrade head && alembic downgrade base && alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/astroai-ci-migrations.sqlite3
          SECRET_KEY: ci-only-not-a-production-secret

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up backend environment for Playwright
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]'
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
